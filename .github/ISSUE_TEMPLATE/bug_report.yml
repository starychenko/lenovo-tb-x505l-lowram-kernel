name: Kernel bug report
description: Report a reproducible TB-X505L r5 problem without private device data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste IMEI, serial number, MAC address, IP address, account data or proprietary firmware.
  - type: input
    id: model
    attributes:
      label: Exact model and memory configuration
      placeholder: Lenovo TB-X505L, 2 GB / 32 GB
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor build
      placeholder: TB-X505L_S001149_221018_ROW
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM or GSI
      placeholder: LineageOS 18.1 PHH GSI, Android 11
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How was the kernel started?
      options:
        - Temporary fastboot boot
        - Permanently flashed boot
        - Unknown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Reproduction and observed result
      description: Include exact steps, expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include uname -a and only the relevant dmesg lines, with identifiers removed.
      render: text
    validations:
      required: true
  - type: dropdown
    id: rollback
    attributes:
      label: What happens after restoring your original boot image?
      options:
        - The problem disappears
        - The problem remains
        - Rollback was not tested
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed unique identifiers and private data from this report.
          required: true
        - label: I understand that this project is tested only on the documented TB-X505L configuration.
          required: true
